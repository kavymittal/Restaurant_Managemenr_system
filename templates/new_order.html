{% extends "base.html" %}
{% block content %}
<h2>Create New Order</h2>

<form method="POST">
    <label>Customer:</label>
    <select name="customer_id" required>
        {% for c in customers %}
            <option value="{{ c.customer_id }}">{{ c.name }} - {{ c.phone }}</option>
        {% endfor %}
    </select>

    <label>Dining Table:</label>
    <select name="table_id">
        <option value="">-- Takeaway / None --</option>
        {% for t in tables %}
            <option value="{{ t.table_id }}">Table {{ t.table_id }} ({{ t.seats }} seats)</option>
        {% endfor %}
    </select>

    <label>Waiter:</label>
    <select name="emp_id">
        <option value="">-- No Waiter --</option>
        {% for w in waiters %}
            <option value="{{ w.emp_id }}">{{ w.name }}</option>
        {% endfor %}
    </select>

    <h3>Choose Food Items</h3>
    <div id="items">
        <div class="item-row">
            <select name="item_id" required>
                {% for item in menu %}
                    <option value="{{ item.item_id }}">{{ item.item_name }} - ₹{{ item.price }}</option>
                {% endfor %}
            </select>
            <input type="number" name="quantity" min="1" value="1" required>
        </div>
    </div>

    <br>
    <button type="button" onclick="addItem()" class="btn">Add Another Item</button>

    <br><br>
    <label>Discount Amount (₹):</label>
    <input type="number" name="discount" value="0.00" min="0" step="0.01">

    <label>Payment Method:</label>
    <select name="payment_method">
        <option value="Cash">Cash</option>
        <option value="UPI">UPI</option>
        <option value="Card">Card</option>
    </select>

    <br><br>
    <button type="submit">Place Order & Generate Bill</button>
</form>

<script>
function addItem() {
    let container = document.getElementById("items");
    let firstRow = container.querySelector(".item-row");
    let copy = firstRow.cloneNode(true);
    copy.querySelector("input").value = 1;
    container.appendChild(copy);
}
</script>
{% endblock %}
